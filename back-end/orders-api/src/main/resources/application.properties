spring.application.name=orders-api
server.port=8400

# Banco local. No Docker, estes valores vêm do Consul (docker/config/load-config.sh).
spring.datasource.url=jdbc:postgresql://localhost/db_orders
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.config.import=optional:consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

# Endereço do product-api (nome registrado no Consul; o load balancer resolve).
orders.product-api.base-url=http://product-api
