spring.application.name=gateway-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=consul:
spring.cloud.consul.config.watch.enabled=false

# Segredo do JWT (mínimo 32 caracteres), vindo da variável de ambiente JWT_SECRET.
# Precisa ser o mesmo valor usado no auth-api.
app.jwt.secret=${JWT_SECRET}
