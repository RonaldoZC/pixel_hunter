spring.application.name=gateway-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=consul:
spring.cloud.consul.config.watch.enabled=false

# Segredo do JWT (mínimo 32 caracteres), vindo da variável de ambiente JWT_SECRET.
# Precisa ser o mesmo valor usado no auth-api.
app.jwt.secret=${JWT_SECRET}

# Swagger UI único (http://localhost:8080/swagger-ui.html) reunindo a documentação dos serviços
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=auth-api
springdoc.swagger-ui.urls[0].url=/docs/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=product-api
springdoc.swagger-ui.urls[1].url=/docs/product/v3/api-docs
springdoc.swagger-ui.urls[2].name=orders-api
springdoc.swagger-ui.urls[2].url=/docs/orders/v3/api-docs
springdoc.swagger-ui.urls[3].name=currency-api
springdoc.swagger-ui.urls[3].url=/docs/currency/v3/api-docs
springdoc.swagger-ui.urls[4].name=media-api
springdoc.swagger-ui.urls[4].url=/docs/media/v3/api-docs
