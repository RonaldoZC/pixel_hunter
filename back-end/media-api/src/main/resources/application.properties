spring.application.name=media-api
server.port=8300

spring.config.import=optional:consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

# Limite de upload (a validação de 5 MB também é feita no código).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cloudflare R2: credenciais vêm de variáveis de ambiente (ver .env.example). Nunca commitar valores reais.
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.public-url=${R2_PUBLIC_URL}
