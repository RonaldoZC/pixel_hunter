# Prometheus: coleta as métricas (Micrometer) de todos os microsserviços.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pixel-hunter
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-api:8080']
        labels: { service: gateway-api }
      - targets: ['auth-api:8200']
        labels: { service: auth-api }
      - targets: ['product-api:8000']
        labels: { service: product-api }
      - targets: ['media-api:8300']
        labels: { service: media-api }
      - targets: ['orders-api:8400']
        labels: { service: orders-api }
      - targets: ['currency-api:8100']
        labels: { service: currency-api }
