services:
  # ============================================
  # CONSUL
  # ============================================
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0 -ui
    networks:
      - backend
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # CARREGAMENTO DAS CONFIGURACOES
  # ============================================
  consul-config:
    image: hashicorp/consul:1.21
    container_name: consul-config
    entrypoint: ["/bin/sh", "/scripts/load-config.sh"]
    volumes:
      - ./config/load-config.sh:/scripts/load-config.sh:ro
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      DB_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - PRODUCT API
  # ============================================
  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_DB: db_product
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_product"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - CURRENCY API
  # ============================================
  currency-db:
    image: postgres:17
    container_name: currency-db
    environment:
      POSTGRES_DB: db_currency
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - currency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_currency"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - AUTH API
  # ============================================
  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # BANCO DE DADOS - ORDERS API
  # ============================================
  orders-db:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_DB: db_orders
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ============================================
  # PRODUCT API
  # ============================================
  product-api:
    build:
      context: ../product-api
    container_name: product-api
    ports:
      - "8000:8000"
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      # Limita a memória da JVM (PC com pouca RAM)
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      product-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # CURRENCY API
  # ============================================
  currency-api:
    build:
      context: ../currency-api
    container_name: currency-api
    ports:
      - "8100:8100"
    environment:
      SPRING_CONFIG_IMPORT: "consul:"
      # Limita a memória da JVM (PC com pouca RAM)
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      currency-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # AUTH API
  # ============================================
  auth-api:
    build:
      context: ../auth-api
    container_name: auth-api
    ports:
      - "8200:8200"
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      SPRING_CONFIG_IMPORT: "consul:"
      # Limita a memória da JVM (PC com pouca RAM)
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # MEDIA API (upload de imagens para o Cloudflare R2)
  # ============================================
  media-api:
    build:
      context: ../media-api
    container_name: media-api
    ports:
      - "8300:8300"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
      R2_ENDPOINT: ${R2_ENDPOINT:-https://r2.invalid}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-nao-configurado}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-nao-configurado}
      R2_BUCKET: ${R2_BUCKET:-nao-configurado}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://r2.invalid}
    depends_on:
      consul-config:
        condition: service_completed_successfully
    networks:
      - backend

  # ============================================
  # ORDERS API
  # ============================================
  orders-api:
    build:
      context: ../orders-api
    container_name: orders-api
    ports:
      - "8400:8400"
    environment:
      SPRING_CONFIG_IMPORT: "optional:consul:"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
      orders-db:
        condition: service_healthy
    networks:
      - backend

  # ============================================
  # GATEWAY API
  # ============================================
  gateway-api:
    build:
      context: ../gateway-api
    container_name: gateway-api
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      SPRING_CONFIG_IMPORT: "consul:"
      # Limita a memória da JVM (PC com pouca RAM)
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: "8500"
    depends_on:
      consul-config:
        condition: service_completed_successfully
    networks:
      - backend

  # ============================================
  # OBSERVABILIDADE - TRACING (Zipkin)
  # ============================================
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m"
    mem_limit: 384m
    networks:
      - backend

  # ============================================
  # OBSERVABILIDADE - METRICAS (Prometheus)
  # ============================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    networks:
      - backend

  # ============================================
  # OBSERVABILIDADE - LOGS (Loki + Promtail)
  # ============================================
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    mem_limit: 256m
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Acesso ao Docker para descobrir os containers e ler seus logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    mem_limit: 128m
    networks:
      - backend

  # ============================================
  # OBSERVABILIDADE - VISUALIZACAO (Grafana)
  # ============================================
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pixel-hunter.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - zipkin
    mem_limit: 256m
    networks:
      - backend

# ============================================
# REDE E VOLUMES
# ============================================
networks:
  backend:
    driver: bridge

volumes:
  product_data:
  currency_data:
  auth_data:
  orders_data:
  prometheus_data:
  loki_data:
  grafana_data:
